name: Deploy to GitHub Pages

# Builds and deploys to GitHub Pages on every push to main.
# Served at https://param241106-art.github.io/SJD-Tradehouse/ for now. To move
# to a custom domain: add public/CNAME, then set BASE_PATH to '/' and SITE_URL
# to 'https://<domain>' below. No code changes are needed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          BASE_PATH: /SJD-Tradehouse/
          SITE_URL: https://param241106-art.github.io/SJD-Tradehouse
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
