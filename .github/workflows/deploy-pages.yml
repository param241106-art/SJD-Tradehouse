name: Deploy to GitHub Pages

# Manual deployment for the SJD TRADEHOUSE copy. Configure its hosting domain
# and repository secrets before running this workflow; see README.md.
# The original domain-root layout is retained (base: '/').

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pushes every URL in sitemap.xml to IndexNow (Bing, Yandex, Naver,
      # Seznam.cz) so new/changed pages are picked up immediately instead of
      # waiting on their next scheduled crawl. Key file lives at
      # public/bf6b9a2a19458077a836ab6fdefdb541.txt, served at the site
      # root exactly as IndexNow requires. Best-effort: a failure here
      # shouldn't fail the deploy.
      - name: Submit sitemap URLs to IndexNow
        continue-on-error: true
        run: |
          python3 -c "
          import json, re, urllib.request

          with open('public/sitemap.xml') as f:
              urls = re.findall(r'<loc>(.*?)</loc>', f.read())

          payload = json.dumps({
              'host': 'avantspecs.com',
              'key': 'bf6b9a2a19458077a836ab6fdefdb541',
              'keyLocation': 'https://avantspecs.com/bf6b9a2a19458077a836ab6fdefdb541.txt',
              'urlList': urls,
          }).encode()

          req = urllib.request.Request(
              'https://api.indexnow.org/indexnow',
              data=payload,
              headers={'Content-Type': 'application/json; charset=utf-8'},
          )
          with urllib.request.urlopen(req) as resp:
              print('IndexNow response:', resp.status)
          "
