<!doctype html>
<!--
  The products page moved from /register to /products. GitHub Pages can't send
  a server-side 301, so this static page does the redirect: an instant meta
  refresh (which Google treats as a permanent redirect) plus a canonical tag.
  Keep this file so old links and backlinks to /register keep working. It is
  not in sitemap.xml, so scripts/prerender.mjs leaves it alone.
  %SITE_URL% / %BASE_URL% are filled in at build time (vite.config.ts).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Products | SJD TRADEHOUSE</title>
    <link rel="canonical" href="%SITE_URL%/products/" />
    <meta http-equiv="refresh" content="0; url=%BASE_URL%products/" />
    <script>
      location.replace('%BASE_URL%products/' + location.search + location.hash);
    </script>
  </head>
  <body>
    <p>This page has moved to <a href="%BASE_URL%products/">our products page</a>.</p>
  </body>
</html>
