<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Decodes the redirect from public/404.html (GitHub Pages SPA
      // fallback — see that file). Must run before the app's router reads
      // location.pathname, so it's the very first thing in <head>. No-op
      // when the page loads normally (no ?p= param).
      (function () {
        document.documentElement.classList.add('js');
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get('p');
        if (redirect) {
          var url = new URL(redirect, window.location.origin);
          window.history.replaceState(null, '', url.pathname + url.search + url.hash);
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12291d" />
    <title>Botanical Export House India | SJD TRADEHOUSE</title>
    <meta
      name="description"
      content="SJD TRADEHOUSE is a botanical export house in India, a merchant export house sourcing, GC-MS testing, and shipping essential oils, oleoresins, spices, nuts, dried fruits, grains and millets, powders, and eco disposables to wholesale buyers worldwide. As a documented, COA-backed essential oil and spice exporter, every consignment ships fully documented to spec."
    />
    <link rel="canonical" href="%SITE_URL%/" />

    <!--
      Self-hosted fonts, preloaded so they usually arrive before first paint.
      See the @font-face rules in src/index.css.
    -->
    <link
      rel="preload"
      href="%BASE_URL%fonts/fraunces-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%BASE_URL%fonts/manrope-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%images/logo-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:site_name" content="SJD TRADEHOUSE" />
    <meta property="og:title" content="Botanical Export House India | SJD TRADEHOUSE" />
    <meta
      property="og:description"
      content="A botanical export house and merchant export house in India, sourcing, GC-MS testing, and shipping essential oils, oleoresins, spices, nuts, dried fruits, grains and millets, powders, and eco disposables to wholesale buyers worldwide. Every consignment fully documented to spec."
    />
    <meta property="og:image" content="%SITE_URL%/images/Shipping.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Botanical Export House India | SJD TRADEHOUSE" />
    <meta
      name="twitter:description"
      content="A botanical export house and merchant export house in India, sourcing, GC-MS testing, and shipping essential oils, oleoresins, spices, nuts, dried fruits, grains and millets, powders, and eco disposables to wholesale buyers worldwide."
    />
    <meta name="twitter:image" content="%SITE_URL%/images/Shipping.jpg" />

    <!--
      Structured data is generated from src/data/content.ts by
      src/lib/structuredData.ts and injected per route; scripts/prerender.mjs
      bakes it (and the rendered page) into the static HTML.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
